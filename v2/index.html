<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gili Dashboard</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div id="app" class="app"></div>
<div id="overlay" class="overlay"></div>
<script type="module" src="js/app.js"></script>
<script>
  // If a module fails to load (e.g. no network for the Supabase library), say so instead of a blank page.
  setTimeout(() => {
    const app = document.getElementById('app');
    if (!app.children.length) app.innerHTML = '<div class="empty">Konnte nicht geladen werden. Bitte die Seite neu laden.</div>';
  }, 10000);
</script>
</body>
</html>
